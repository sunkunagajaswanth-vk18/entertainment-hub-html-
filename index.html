<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore Entertainment</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --background: #08090d;
    --card: #151820;
    --border: #292e3a;
    --text: #ffffff;
    --muted: #a3a8b5;
    --accent: #ff5733;
}

body {
    font-family: Arial, sans-serif;
    background: var(--background);
    color: var(--text);
    min-height: 100vh;
}

.container {
    width: 92%;
    max-width: 1400px;
    margin: auto;
}

.image-library {
    display: none;
}

#home {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 0;
}

.main-title {
    font-size: clamp(32px, 5vw, 60px);
    text-align: center;
    margin-bottom: 15px;
}

.main-title span {
    color: var(--accent);
}

.home-subtitle {
    color: var(--muted);
    margin-bottom: 45px;
    text-align: center;
}

.main-options {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}

.main-card {
    min-height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    cursor: pointer;
    transition: .3s;
}

.main-card:hover {
    transform: translateY(-7px);
    border-color: var(--accent);
}

.page {
    display: none;
    min-height: 100vh;
    padding: 35px 0 70px;
}

.page.active {
    display: block;
}

.back-btn {
    padding: 12px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: white;
    cursor: pointer;
    margin-bottom: 30px;
}

.back-btn:hover {
    border-color: var(--accent);
}

.page-title {
    font-size: clamp(30px, 4vw, 45px);
    text-align: center;
    margin-bottom: 12px;
}

.page-subtitle {
    color: var(--muted);
    text-align: center;
    margin-bottom: 30px;
}

.category-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.category-card {
    min-height: 130px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    color: white;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

.category-card:hover {
    border-color: var(--accent);
    transform: translateY(-5px);
}

.content-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 30px;
}

.category-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.filter-btn {
    padding: 11px 20px;
    background: #20242d;
    color: white;
    border: 1px solid #303642;
    border-radius: 25px;
    cursor: pointer;
}

.filter-btn:hover {
    border-color: var(--accent);
}

.filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
}

.search-box {
    width: 300px;
    flex-shrink: 0;
}

.search-box input {
    width: 100%;
    padding: 13px 18px;
    background: #151820;
    border: 1px solid #303642;
    border-radius: 25px;
    outline: none;
    color: white;
}

.search-box input::placeholder {
    color: #777d89;
}

.content-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}

.content-card {
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    transition: .3s;
    cursor: pointer;
}

.content-card:hover {
    transform: translateY(-6px);
    border-color: var(--accent);
}

.poster {
    width: 100%;
    height: 300px;
    overflow: hidden;
    background: #202b40;
}

.poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .3s ease;
}

.content-card:hover .poster img {
    transform: scale(1.05);
}

.details {
    padding: 20px;
}

.title {
    font-size: 23px;
    margin-bottom: 12px;
}

.rating {
    margin-bottom: 15px;
}

.stars {
    color: #ffc107;
    letter-spacing: 2px;
    margin-right: 8px;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 15px;
}

.tag {
    background: #252b36;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 12px;
}

.languages {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
}

.click-hint {
    margin-top: 14px;
    font-size: 13px;
    color: var(--accent);
    font-weight: bold;
}

.no-results {
    display: none;
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
}

/* MODAL STYLES */

.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(6px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
}

.modal-overlay.active {
    display: flex;
}

.modal-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    max-width: 900px;
    width: 100%;
    overflow: hidden;
    position: relative;
    display: grid;
    grid-template-columns: 320px 1fr;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    animation: modalFadeIn 0.25s ease-out;
}

@keyframes modalFadeIn {
    from {
        opacity: 0;
        transform: scale(0.95);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #20242d;
    border: 1px solid #303642;
    color: white;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: .2s;
    z-index: 10;
}

.modal-close:hover {
    background: var(--accent);
    border-color: var(--accent);
}

.modal-poster {
    width: 100%;
    height: 100%;
    min-height: 420px;
    background: #202b40;
}

.modal-poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.modal-info {
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.modal-title {
    font-size: 30px;
    color: var(--text);
    padding-right: 35px;
}

.modal-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.modal-summary {
    color: #d1d5db;
    font-size: 15px;
    line-height: 1.65;
    background: #10131a;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #232733;
}

.modal-meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.meta-item {
    background: #1b1f29;
    padding: 12px 15px;
    border-radius: 12px;
    border: 1px solid #292e3a;
}

.meta-item.full-width {
    grid-column: 1 / -1;
}

.meta-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--accent);
    font-weight: bold;
    margin-bottom: 5px;
}

.meta-value {
    font-size: 15px;
    color: #ffffff;
    line-height: 1.5;
}

.stream-badge {
    display: inline-block;
    background: rgba(255, 87, 51, 0.15);
    border: 1px solid var(--accent);
    color: #ff856b;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    margin-right: 8px;
    margin-top: 4px;
}

@media(max-width: 900px) {

    .main-options {
        grid-template-columns: 1fr;
    }

    .category-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .content-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .content-toolbar {
        flex-direction: column;
        align-items: stretch;
    }

    .search-box {
        width: 100%;
    }

    .modal-box {
        grid-template-columns: 1fr;
        max-height: 90vh;
        overflow-y: auto;
    }

    .modal-poster {
        height: 280px;
        min-height: 280px;
    }
}

@media(max-width: 600px) {

    .category-grid,
    .content-grid {
        grid-template-columns: 1fr;
    }

    .poster {
        height: 260px;
    }

    .modal-meta-grid {
        grid-template-columns: 1fr;
    }
}

.main-card {
    text-decoration: none;
    color: white;
}

.page {
    display: block;
}
</style>
</head>

<body>

<!-- HOME PAGE -->

<div class="container">

<section id="home">

    <h1 class="main-title">
        Explore <span>Entertainment</span>
    </h1>

    <p class="home-subtitle">
        Discover Movies, Anime and Web Series
    </p>

    <div class="main-options">

        <a class="main-card" href="movies.html">
            <h2>Movies</h2>
        </a>

        <a class="main-card" href="anime.html">
            <h2>Anime</h2>
        </a>

        <a class="main-card" href="webseries.html">
            <h2>Web Series</h2>
        </a>

    </div>

</section>

</div>

</body>
</html>
